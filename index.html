<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Advanced Tree Service</title>
  <meta name="theme-color" content="#2f5d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ATS Estimates">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="brand/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=7">
  <script src="brand.js?v=7"></script>
</head>
<body>
  <header class="appbar">
    <button type="button" class="icon-btn" id="appbar-back" data-act="home" aria-label="Back to estimates" hidden>‹</button>
    <img src="brand/logo.svg" alt="" class="appbar-logo" id="appbar-logo">
    <div class="appbar-title" id="appbar-title">Advanced Tree Service</div>
    <button type="button" class="icon-btn" data-act="menu" aria-label="Menu">☰</button>
  </header>

  <main id="view"></main>

  <footer class="bottombar" id="bottombar" hidden>
    <button type="button" class="btn" data-act="prev" id="btn-prev">‹ Back</button>
    <button type="button" class="btn primary" data-act="next" id="btn-next">Next ›</button>
  </footer>

  <!-- Printable estimate, filled in right before printing -->
  <div id="print-doc"></div>

  <!-- Add / edit one tree -->
  <dialog id="tree-dlg" class="sheet" data-scope="tree"></dialog>

  <!-- Simple list picker (previous customers) -->
  <dialog id="pick-dlg" class="sheet small">
    <div class="sheet-head">
      <button type="button" class="icon-btn" data-act="close-dlg" aria-label="Close">✕</button>
      <h3 id="pick-title">Past clients</h3>
      <span></span>
    </div>
    <div class="sheet-body">
      <input type="search" id="pick-search" placeholder="Search name, phone, address">
      <div id="pick-list" class="pick-list"></div>
    </div>
  </dialog>

  <dialog id="menu-dlg" class="sheet small">
    <div class="sheet-head">
      <button type="button" class="icon-btn" data-act="close-dlg" aria-label="Close">✕</button>
      <h3>Menu</h3>
      <span></span>
    </div>
    <div class="sheet-body menu">
      <button type="button" class="menu-item" data-act="home">📋 Estimates</button>
      <button type="button" class="menu-item" data-act="profile">🏢 Company profile</button>
      <button type="button" class="menu-item" data-act="export">⬇️ Back up estimates</button>
      <button type="button" class="menu-item" data-act="import">⬆️ Restore from backup</button>
      <button type="button" class="menu-item" data-act="install" id="menu-install" hidden>📲 Install app on this device</button>
    </div>
  </dialog>

  <input type="file" id="vcf-file" accept=".vcf,text/vcard,text/x-vcard" hidden>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <input type="file" id="logo-file" accept="image/*" hidden>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=7"></script>
</body>
</html>
