# Test, build and publish the new app.
#
# Every push and pull request runs the tests. A push to main (or a manual run)
# also builds the app and publishes it to the `deploy` branch, which the
# Hostinger subdomain pulls. If any test fails, nothing is published.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL       e.g. https://abcd1234.supabase.co
#   VITE_SUPABASE_ANON_KEY  the "anon public" key (never the service_role key)
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npx vitest run
      - name: Database security tests
        working-directory: .
        run: supabase/tests/run-local.sh

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the Supabase settings are there
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY under Settings → Secrets and variables → Actions, then run this workflow again."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in https://*.supabase.co) ;; *)
            echo "::error::VITE_SUPABASE_URL should look like https://abcd1234.supabase.co"; exit 1 ;; esac
      - name: Build
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build
      - name: Publish to the deploy branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: scripts/publish-dist.sh web/dist "$REMOTE" deploy "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
